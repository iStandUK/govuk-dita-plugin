name: pages

# The released manual on GitHub Pages (#275). It publishes the manual website that
# the release workflow already built, attested and attached to the release (#167):
# nothing is rebuilt here, so the site is exactly the asset whose SHA-256 and
# provenance anyone can check. Runs when a release is published, for the latest
# release only (a hotfix to an older line leaves the site alone), and by hand for
# a chosen tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose manual to publish (empty for the latest release)
        type: string
        default: ""

permissions:
  contents: read

# one deployment at a time; a later one waits rather than cancelling a running one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'release' || !github.event.release.prerelease
    permissions:
      contents: read
      pages: write      # deploy to Pages
      id-token: write   # prove to Pages that the deployment comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Choose the release
        id: release
        env:
          # through the environment, never into the script text
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          tag="${REQUESTED_TAG:-$latest}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "release" ] && [ "$tag" != "$latest" ]; then
            echo "::notice::$tag is not the latest release ($latest), so the site is left as it is"
            echo "publish=no" >> "$GITHUB_OUTPUT"
          else
            echo "publish=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the manual website and check it
        if: steps.release.outputs.publish == 'yes'
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --dir manual --pattern '*-manual-*.zip' --pattern '*-manual-*.zip.sha256'
          cd manual
          ls
          # the checksum on the release, then the provenance the release workflow signed
          sha256sum -c ./*.zip.sha256
          gh attestation verify ./*-manual-*.zip --repo "$GITHUB_REPOSITORY"
          unzip -q ./*-manual-*.zip -d site
          # the zip holds the site as one folder
          dir=$(find site -mindepth 1 -maxdepth 1 -type d | LC_ALL=C sort | head -n 1)
          test -f "$dir/index.html" || { echo "no index.html in the manual zip"; exit 1; }
          echo "SITE=manual/$dir" >> "$GITHUB_ENV"

      - name: Upload the site
        if: steps.release.outputs.publish == 'yes'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.SITE }}

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.release.outputs.publish == 'yes'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
