name: build

# Least privilege (#66): nothing here writes to the repository. Actions are
# pinned to commit SHAs (#67, Dependabot keeps the comments current); every
# download is checksum-verified before use (#68).
permissions:
  contents: read

# A newer push to the same pull request supersedes the run in progress; pushes
# to the long-lived branches always run to completion.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Gitflow (D-22): pushes to the long-lived and release-line branches, and every
# pull request. Feature branches are exercised through their pull request.
on:
  push:
    branches: [main, dev, 'release/**', 'hotfix/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # The repository holds two products (D-23): the plugin and DesignSystemPDF.
  # Each change runs the jobs of the product it touches. Documentation-only
  # changes (the design record, repository policy files, templates) run
  # neither; the manual under docs/manual/ is built and tested, so it is not
  # documentation in this sense. A change to the workflows runs both. `ci`
  # still reports, so the branch rules are satisfied either way.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      plugin: ${{ steps.classify.outputs.plugin }}
      pdf: ${{ steps.classify.outputs.pdf }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # No usable base (a new branch, a tag, a manual run): build everything.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || [ "$GITHUB_REF_TYPE" = "tag" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] \
             || ! git cat-file -e "$BASE" 2>/dev/null; then
            { echo "plugin=true"; echo "pdf=true"; } >> "$GITHUB_OUTPUT"; echo "full run: no base to compare against"; exit 0
          fi
          files=$(git diff --name-only "$(git merge-base "$BASE" "$HEAD")" "$HEAD")
          printf 'changed:\n%s\n' "$files"
          docs='^(design/|docs/RELEASING\.md$|README\.md$|CONTRIBUTING\.md$|SECURITY\.md$|LICENSE|\.gitignore$|\.github/(ISSUE_TEMPLATE/|pull_request_template\.md$|CODEOWNERS$|dependabot\.yml$))'
          rest=$(printf '%s\n' "$files" | grep -Ev "$docs" || true)
          # an empty diff is treated as a full run, as before
          if [ -z "$files" ]; then
            { echo "plugin=true"; echo "pdf=true"; } >> "$GITHUB_OUTPUT"; echo "full run: nothing to classify"; exit 0
          fi
          workflows=$(printf '%s\n' "$rest" | grep -E '^\.github/workflows/' || true)
          pdf=$(printf '%s\n' "$rest" | grep -E '^designsystempdf/' || true)
          plugin=$(printf '%s\n' "$rest" | grep -Ev '^designsystempdf/' || true)
          if [ -n "$plugin" ]; then echo "plugin=true"; else echo "plugin=false"; fi >> "$GITHUB_OUTPUT"
          if [ -n "$pdf" ] || [ -n "$workflows" ]; then echo "pdf=true"; else echo "pdf=false"; fi >> "$GITHUB_OUTPUT"
          if [ -z "$rest" ]; then echo "documentation-only change: nothing is built"; fi
          cat "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    name: build (DITA-OT ${{ matrix.dita-ot.version }})
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    # DITA-OT version matrix (NFR-M1): add 4.x releases here as they appear,
    # each with the SHA-256 of its distribution zip (shasum -a 256).
    strategy:
      fail-fast: false
      matrix:
        dita-ot:
          - version: "4.4.1"
            sha256: "154414c1debb548e923bf77e9a09019e249a8887680ff4bfbd8e137de9e8e250"
    env:
      DITA_OT_VERSION: ${{ matrix.dita-ot.version }}
      DITA_OT_SHA256: ${{ matrix.dita-ot.sha256 }}
      # govuk-frontend GitHub release zip for the vendored version (VERSION.txt)
      GOVUK_FRONTEND_SHA256: "ac64b3abdb8af98624c8c0b8eabf78c894eb9da4d3b268544d0120f15abafc7a"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/a11y/package.json

      - name: Cache DITA-OT
        id: cache-dita-ot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dita-ot-${{ env.DITA_OT_VERSION }}
          key: dita-ot-${{ env.DITA_OT_VERSION }}

      - name: Download DITA-OT
        if: steps.cache-dita-ot.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o dita-ot.zip "https://github.com/dita-ot/dita-ot/releases/download/${DITA_OT_VERSION}/dita-ot-${DITA_OT_VERSION}.zip"
          echo "${DITA_OT_SHA256}  dita-ot.zip" | sha256sum -c -
          unzip -q dita-ot.zip
          rm dita-ot.zip

      - name: Install plugin
        run: |
          (cd org.istanduk.gov-uk && zip -qr ../org.istanduk.gov-uk.zip .)
          # The cached DITA-OT may hold the plugin from an earlier run
          "dita-ot-${DITA_OT_VERSION}/bin/dita" uninstall org.istanduk.gov-uk || true
          "dita-ot-${DITA_OT_VERSION}/bin/dita" install "$PWD/org.istanduk.gov-uk.zip"

      # Built BEFORE Pagefind is installed: exercises the graceful-absence path
      # (govuk.search=auto with no binary -> site without search, FR-S4)
      - name: Build ORUK fixture (no Pagefind)
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" \
            --input fixtures/oruk-mini/oruk.ditamap \
            --format govuk \
            --output out/oruk-mini

      - name: Install Pagefind
        run: npm install -g pagefind@1.5.2

      # Built with Pagefind on the PATH: search auto-enables (FR-S1)
      - name: Build manual
        run: |
          set -o pipefail
          "dita-ot-${DITA_OT_VERSION}/bin/dita" \
            --input docs/manual/manual.ditamap \
            --format govuk \
            --output out/manual 2>&1 | tee manual-build.log

      - name: Build layout overrides
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-grid -Dgovuk.homepage.layout=grid
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-accordion -Dgovuk.homepage.layout=accordion

      - name: Build depth override (also exercises the phase banner, FR-T3/#49)
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-depth1 \
            -Dgovuk.homepage.layout=grid -Dgovuk.homepage.depth=1 \
            -Dgovuk.phase=beta -Dgovuk.feedback.url=https://example.org/feedback

      # Spec-coverage fixture (design/08) - fully Nu-validated
      - name: Build DITA 1.3 kitchen sink
        run: |
          set -o pipefail
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/dita13-kitchen/kitchen.ditamap \
            --format govuk --output out/kitchen 2>&1 | tee kitchen.log
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/dita13-kitchen/kitchen.ditamap \
            --format govuk --output out/kitchen-flag --filter fixtures/dita13-kitchen/flags.ditaval
          # spot-checks of verified processing behaviour
          test -f out/kitchen/topics/composite_comp-child-one.html
          # chunk=by-topic children resolve assets to the output root (upstream PATH2PROJ bug worked around)
          grep -q '"../govuk/plugin.css"' out/kitchen/topics/composite_comp-child-one.html
          grep -q 'Reused safety note' out/kitchen/topics/conref-use.html
          ! grep -q 'excluded by the filter' out/kitchen-flag/topics/blocks.html
          grep -q 'administrators' out/kitchen-flag/topics/blocks.html
          # DITAVAL style flags render — flag__style--* CSS shipped and applied (#29)
          grep -q 'flag__style--italics' out/kitchen-flag/govuk/plugin.css
          grep -q 'flag__style--italics' out/kitchen-flag/topics/blocks.html

      - name: Build iStandUK theme
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-istanduk -Dgovuk.branding=istanduk

      - name: Build NHS branding
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-nhs -Dgovuk.branding=nhs

      - name: Build official (GOV.UK crown) branding
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-official -Dgovuk.branding=official

      - name: Build FR-T3 furniture params (service URL, favicon, footer links/licence)
        run: |
          printf '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" fill="#1d70b8"/></svg>' > favicon.svg
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-frt3 \
            -Dgovuk.service.url=https://example.gov.uk \
            -Dgovuk.favicon="$PWD/favicon.svg" \
            "-Dgovuk.footer.links=Privacy|https://example.gov.uk/privacy;Contact|https://example.gov.uk/contact" \
            "-Dgovuk.footer.licence=© 2026 Example Service"

      # FR-T4, #142: the publisher's stylesheet (args.css) is copied into the
      # output and linked after the plugin's on every kind of page. The stylesheet is the
      # sample the manual prints, so what publishers copy is what is tested —
      # here, by the HTML validator and by the accessibility checks below.
      - name: Build with a publisher stylesheet (FR-T4, #142)
        run: |
          last_css() { grep -o '<link rel="stylesheet"[^>]*>' "$1" | tail -1; }
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-custom -Dgovuk.print=yes \
            -Dargs.css=custom.css "-Dargs.cssroot=$PWD/docs/manual/samples" -Dargs.copycss=yes
          cmp docs/manual/samples/custom.css out/manual-custom/custom.css
          for page in index.html glossary.html index-page.html figurelist.html tablelist.html print.html; do
            last_css "out/manual-custom/$page" | grep -q 'href="custom.css"' || { echo "custom.css is not the last stylesheet on $page"; exit 1; }
          done
          last_css out/manual-custom/topics/install.html | grep -q 'href="../custom.css"'
          # on the search page only the search component's own stylesheet follows it
          grep -q 'href="custom.css"' out/manual-custom/search.html
          # the manual prints the sample itself
          grep -q -e '--brand-colour: #00594f' out/manual-custom/topics/custom-css.html
          # a branding mode's overlay still comes first, and args.csspath moves the file
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/oruk-mini/oruk.ditamap \
            --format govuk --output out/oruk-custom -Dgovuk.branding=istanduk \
            -Dargs.css=custom.css "-Dargs.cssroot=$PWD/docs/manual/samples" -Dargs.copycss=yes -Dargs.csspath=theme
          test -f out/oruk-custom/theme/custom.css
          grep -q 'overlay-istanduk.css' out/oruk-custom/item.html
          last_css out/oruk-custom/item.html | grep -q 'href="theme/custom.css"'
          last_css out/oruk-custom/index.html | grep -q 'href="theme/custom.css"'

      # Trial finding (#51): DITA-OT resolves no key inside a submap included with
      # <mapref keyref>; the plugin must warn (GOVK001W) and name the entry, and
      # stay silent for the same submap included with <mapref href> and for the manual.
      - name: Build keyref-nest fixture (unresolved keys, #51)
        run: |
          set -o pipefail
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/keyref-nest/root-keyref.ditamap \
            --format govuk --output out/keyref-nest 2>&1 | tee keyref-nest.log
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/keyref-nest/root-href.ditamap \
            --format govuk --output out/keyref-nest-href 2>&1 | tee keyref-nest-href.log
          grep -q "\[GOVK001W\]" keyref-nest.log
          grep -q "Navigation entry 'Group' has keyref='k-ov'" keyref-nest.log
          # once per affected branch: the nested mapref and topicref beneath 'Group' stay quiet
          test "$(grep -c 'GOVK001W' keyref-nest.log)" = 1
          ! grep -q "GOVK001W" keyref-nest-href.log
          ! grep -q "GOVK001W" manual-build.log
          # the symptom the warning describes, and its absence with <mapref href>
          grep -q '<span>Group</span>' out/keyref-nest/ov.html
          grep -q 'href="ov.html">Overview T</a>' out/keyref-nest-href/t1.html

      # Search relevance from DITA semantics (#54): attributes derived from the DITA,
      # the ranking presets, and validation of the parameter (Pagefind is installed,
      # so search.html is produced).
      - name: Build search-semantics fixture (#54)
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/search-semantics/search.ditamap \
            --format govuk --output out/search-semantics -Dgovuk.search.ranking=reference
          # live topic: shortdesc weighted, "Where used" table ignored, keywords/searchtitle/filters in head
          grep -Eq '<p [^>]*class="[^"]*shortdesc[^"]*"[^>]*data-pagefind-weight="4"' out/search-semantics/live.html
          grep -Eq '<table [^>]*data-pagefind-ignore' out/search-semantics/live.html
          grep -q 'name="keywords" data-pagefind-meta="keywords\[content\]" content="widget identifier, gadget code"' out/search-semantics/live.html
          grep -q 'data-pagefind-meta="title\[content\]" content="Widget Code (Data Element)"' out/search-semantics/live.html
          grep -q 'data-pagefind-filter="category\[content\]" content="Data Element"' out/search-semantics/live.html
          grep -q 'data-pagefind-filter="audience\[content\]" content="analyst"' out/search-semantics/live.html
          ! grep -q 'data-pagefind-weight="0.3"' out/search-semantics/live.html
          # demoted by outputclass on the title, and by importance="obsolete" on the topic
          for t in retired obsolete; do
            grep -Eq '<h1 [^>]*data-pagefind-weight="2"' out/search-semantics/$t.html
            grep -Eq '<div [^>]*class="body[^"]*"[^>]*data-pagefind-weight="0.3"' out/search-semantics/$t.html
            grep -Eq '<p [^>]*class="[^"]*shortdesc[^"]*"[^>]*data-pagefind-weight="1"' out/search-semantics/$t.html
          done
          # ranking: preset, JSON pass-through, and an invalid value must fail the build;
          # it travels as a data attribute read by govuk/search.js (#79), so the page
          # has no variable inline script
          grep -q 'data-ranking="{ &#34;termFrequency&#34;: 0.0, &#34;pageLength&#34;: 0.0 }"' out/search-semantics/search.html
          grep -q '<script src="govuk/search.js">' out/search-semantics/search.html
          test -f out/search-semantics/govuk/search.js
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/search-semantics/search.ditamap \
            --format govuk --output out/search-semantics-json '-Dgovuk.search.ranking={termFrequency:0.5,metaWeights:{keywords:3}}'
          grep -q 'data-ranking="{&#34;termFrequency&#34;:0.5,&#34;metaWeights&#34;:{&#34;keywords&#34;:3}}"' out/search-semantics-json/search.html
          ! "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/search-semantics/search.ditamap \
            --format govuk --output out/search-semantics-bad -Dgovuk.search.ranking=fastest
          # the manual: shortdesc weighting applies everywhere, ranking stays Pagefind's default
          grep -q 'data-pagefind-weight="4"' out/manual/topics/introduction.html
          if grep -q 'data-ranking' out/manual/search.html; then echo "manual search page should carry no ranking"; exit 1; fi

      # Print stylesheet and print document (#63 / FR-P1, FR-P2, D-20). Built to
      # its own directory so the page-weight budget keeps measuring topic pages.
      - name: Build print document (#63)
        run: |
          set -o pipefail
          # bash -e ignores a negated command, so a plain "! grep" can never fail
          # the step; negative assertions go through this instead
          absent() { if grep "$@"; then echo "unexpected match: $*"; exit 1; fi; }
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-print -Dgovuk.print=yes 2>&1 | tee manual-print.log
          test -f out/manual-print/print.html
          absent -q "GOVK003W" manual-print.log
          # cover block, contents, chapter groups, topics with demoted headings, glossary and index parts
          grep -q '<h1 class="govuk-heading-xl">GOV.UK DITA plugin manual</h1>' out/manual-print/print.html
          grep -q 'app-print-contents__list' out/manual-print/print.html
          grep -Eq 'href="#introduction"[^>]*>About the plugin</a>' out/manual-print/print.html
          grep -q '<section class="app-print-group app-print-chapter" id="app-print-group-' out/manual-print/print.html
          grep -Eq '<h3 [^>]*id="t[0-9]+-ariaid-title1"[^>]*>Installing the plugin</h3>' out/manual-print/print.html
          grep -q 'id="app-print-glossary"' out/manual-print/print.html
          grep -q 'id="app-print-index"' out/manual-print/print.html
          # cross-references become in-document anchors; images re-based to the document
          grep -q 'href="#install"' out/manual-print/print.html
          grep -q 'src="images/' out/manual-print/print.html
          # nothing for search to index, no site chrome, no related-links block, no duplicate ids
          # (class attributes, not text: the manual's own topics name these classes)
          absent -q 'data-pagefind' out/manual-print/print.html
          absent -Eq 'class="[^"]*(app-masthead|app-sidebar|govuk-footer|related-links)' out/manual-print/print.html
          test -z "$(grep -o ' id="[^"]*"' out/manual-print/print.html | sort | uniq -d)"
          # linked from the cover and every footer; print.css on every page with the A4 default
          grep -q 'href="print.html">Whole publication (print version)' out/manual-print/index.html
          grep -q 'href="../print.html">Whole publication (print version)' out/manual-print/topics/install.html
          grep -q 'href="print.html">Whole publication (print version)' out/manual-print/glossary.html
          grep -q 'govuk/print.css" media="print"' out/manual-print/topics/install.html
          grep -q 'size: A4 portrait;' out/manual-print/govuk/print.css
          # #148: the print document takes a document's type scale, not a printed web
          # page's — title 28pt, section heading 20pt, subheadings 16 and 14pt, body
          # 12pt, captions 11pt — and only the print document does
          scale() { # selector, size: the first font-size after the selector in print.css
            awk -v sel="$1" -v size="$2" 'index($0, sel) { f = 1 } f && /font-size/ { ok = index($0, " " size ";") > 0; exit } END { exit !ok }' \
              out/manual-print/govuk/print.css || { echo "print.css: $1 should be set at $2"; exit 1; }
          }
          scale '.app-print .govuk-heading-xl {' 28pt
          scale '.app-print .govuk-heading-l {' 20pt
          scale '.app-print .govuk-heading-m {' 16pt
          scale '.app-print .govuk-heading-s,' 14pt
          scale '.app-print .govuk-body-l,' 14pt
          scale '.app-print .govuk-body,' 12pt
          scale '.app-print .govuk-table__caption,' 11pt
          grep -q 'class="govuk-template app-print"' out/manual-print/print.html
          absent -q 'class="govuk-template app-print"' out/manual-print/index.html out/manual-print/topics/install.html
          # the default build: no print document and no links to one (the manual's own
          # topics/print.html page is a different file); print.css still shipped
          test ! -f out/manual/print.html
          absent -q 'href="print.html"' out/manual/index.html
          absent -q 'href="../print.html"' out/manual/topics/install.html
          grep -q 'govuk/print.css" media="print"' out/manual/index.html
          # paper parameters flow into print.css; a bad size fails the build
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/oruk-mini/oruk.ditamap \
            --format govuk --output out/oruk-print -Dgovuk.print=yes \
            -Dgovuk.pdf.paper=Letter -Dgovuk.pdf.orientation=landscape
          grep -q 'size: Letter landscape;' out/oruk-print/govuk/print.css
          if "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/oruk-mini/oruk.ditamap \
            --format govuk --output out/oruk-print-bad -Dgovuk.pdf.paper=A9; then
            echo "govuk.pdf.paper=A9 should have failed the build"; exit 1
          fi
          # a chunked file renders once, its nested topics keep their ids and take cross-references
          test "$(grep -c 'id="item"' out/oruk-print/print.html)" = 1
          grep -q 'id="child2"' out/oruk-print/print.html
          grep -q 'href="#child2"' out/oruk-print/print.html
          # kitchen: footnotes as per-file endnotes, copy-to duplicates prefixed, links inside inlined SVG re-based
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/dita13-kitchen/kitchen.ditamap \
            --format govuk --output out/kitchen-print -Dgovuk.print=yes
          grep -Eq 'name="t[0-9]+-fnsrc_' out/kitchen-print/print.html
          grep -q 'app-print-endnotes' out/kitchen-print/print.html
          # #158: a code block is not parted from the warning or note that introduces it
          awk '/^\.govuk-warning-text \+ pre,$/ { f = 1 } f && /page-break-before: avoid;/ { ok = 1; exit } /^}/ { f = 0 } END { exit !ok }' \
            out/kitchen-print/govuk/print.css || { echo "print.css does not keep a warning with its code block"; exit 1; }
          grep -Eq 'id="p[0-9]+-shared"' out/kitchen-print/print.html
          grep -q 'xlink:href="#blocks"' out/kitchen-print/print.html
          test -z "$(grep -o ' id="[^"]*"' out/kitchen-print/print.html | sort | uniq -d)"
          # the topic ceiling: skipped with a warning, and nothing links to the missing file
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-print-ceiling -Dgovuk.print=yes \
            -Dgovuk.print.max-topics=3 -Dgovuk.search=no 2>&1 | tee ceiling.log
          grep -q "\[GOVK003W\]" ceiling.log
          test ! -f out/manual-print-ceiling/print.html
          absent -q 'href="print.html"' out/manual-print-ceiling/index.html
          absent -q 'href="../print.html"' out/manual-print-ceiling/topics/install.html

      # The print document's cover (#150): publication details and an imprint
      # from the map's metadata and the publisher's parameters — every line
      # present when its source is, and no empty block when it is not.
      - name: Print cover details and imprint (#150)
        run: |
          absent() { if grep "$@"; then echo "unexpected match: $*"; exit 1; fi; }
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/print-cover/cover.ditamap \
            --format govuk --output out/print-cover -Dgovuk.print=yes -Dgovuk.search=no \
            -Dgovuk.phase=beta -Dgovuk.site.url=https://example.org/standard/
          c=out/print-cover/print.html
          grep -q '<li>Status: <strong>Beta</strong></li>' "$c"
          grep -q '<li>Edition 2.1</li>' "$c"
          grep -q 'Published <time datetime="2026-03-01">1 March 2026</time>' "$c"
          # the last of two revisions
          grep -q 'Last updated <time datetime="2026-09-30">30 September 2026</time>' "$c"
          absent -q '15 June 2026' "$c"
          grep -q '<li>ISBN 978-0-00-000000-2</li>' "$c"
          grep -q '<li>Reference ESB-2026-04</li>' "$c"
          grep -q '<p class="govuk-body-s">© 2024–2026 Example Standards Body</p>' "$c"
          grep -q 'Licensed under the Creative Commons Attribution 4.0 International licence.</p>' "$c"
          grep -q 'This publication is available at <a class="govuk-link app-print-url" href="https://example.org/standard/">https://example.org/standard/</a>' "$c"
          # the cover lines the companion generator reads are still there, and the site's own pages are untouched
          grep -q '<p class="govuk-body app-attribution">Example Standards Body</p>' "$c"
          absent -Eq 'class="[^"]*app-print-(meta|imprint)' out/print-cover/index.html out/print-cover/topic.html
          # official branding: Crown copyright and the Open Government Licence, and no second licence statement
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/print-cover/cover.ditamap \
            --format govuk --output out/print-cover-official -Dgovuk.print=yes -Dgovuk.search=no \
            -Dgovuk.branding=official
          c=out/print-cover-official/print.html
          grep -q '<p class="govuk-body-s">© Crown copyright 2024–2026</p>' "$c"
          grep -q 'rel="license" href="https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/">Open Government Licence v3.0</a>' "$c"
          absent -q 'Creative Commons' "$c"
          absent -q 'Status:' "$c"
          # the bookmap's own published date, an edition in words, and no rights: details without an imprint
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/print-cover/published.ditamap \
            --format govuk --output out/print-cover-published -Dgovuk.print=yes -Dgovuk.search=no
          c=out/print-cover-published/print.html
          grep -q '<li>Second edition</li>' "$c"
          grep -q 'Published <time datetime="2026-03-01">1 March 2026</time>' "$c"
          absent -q 'Last updated' "$c"
          absent -Eq 'class="[^"]*app-print-imprint' "$c"
          # no metadata, no block: a bookmap with rights but no dates or identifiers
          # has an imprint and no details; a plain map has neither
          absent -Eq 'class="[^"]*app-print-meta' out/oruk-print/print.html
          grep -q '<div class="app-print-imprint"><p class="govuk-body-s">© The Open Referral Initiative</p></div>' out/oruk-print/print.html
          absent -Eq 'class="[^"]*app-print-(meta|imprint)' out/kitchen-print/print.html
          # the manual's own cover: the edition is the plugin's version (they move
          # together at a release, docs/RELEASING.md), with its dates and copyright
          version=$(sed -n 's/.*<plugin id="org.istanduk.gov-uk" version="\([^"]*\)".*/\1/p' org.istanduk.gov-uk/plugin.xml)
          test -n "$version"
          grep -q "<li>Version ${version}</li>" out/manual-print/print.html \
            || { echo "the edition in docs/manual/manual.ditamap is not plugin.xml's version, ${version}"; exit 1; }
          grep -q 'Published <time datetime="2026-09-01">1 September 2026</time>' out/manual-print/print.html
          grep -Eq 'Last updated <time datetime="[0-9]{4}-[0-9]{2}-[0-9]{2}">' out/manual-print/print.html
          grep -q '<p class="govuk-body-s">© 2026 iStandUK</p>' out/manual-print/print.html
          for site in out/print-cover out/print-cover-official out/print-cover-published; do
            test -z "$(grep -o ' id="[^"]*"' "$site/print.html" | sort | uniq -d)"
          done
          python3 tools/check_links.py out/print-cover out/print-cover-official out/print-cover-published

      # Print page references, the formatter hook, the contract marker and the
      # duplicate-id fix (#106, #107, #108, #121). The Markdown fixture is the
      # shape a converted website has: headings become nested topics, so ids
      # repeat across files.
      - name: Print page numbers and the external formatter (#106–#108, #121)
        run: |
          set -o pipefail
          absent() { if grep "$@"; then echo "unexpected match: $*"; exit 1; fi; }
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/markdown-mini/mdmini.ditamap \
            --format govuk --output out/markdown-mini -Dgovuk.print=yes
          md=out/markdown-mini/print.html
          # #121: ids repeat across the Markdown topics; the merged document must not
          test -z "$(grep -o ' id="[^"]*"' "$md" | sort | uniq -d)"
          grep -q 'id="about"' "$md"                     # the first file keeps the site's ids
          grep -Eq 'id="p[23]-about"' "$md"              # later files that would collide are prefixed
          grep -q 'href="#p2-first-case-study"' "$md"    # and links into them follow
          # #108 contract marker, #107 page-reference labels
          grep -q '<meta name="govuk-print-contract" content="1"' "$md"
          grep -q 'data-page-label="page"' "$md"
          grep -q 'target-counter(attr(href url), page)' out/markdown-mini/govuk/print.css
          # a publication whose ids do not collide is untouched
          absent -Eq ' id="p[0-9]+-' out/manual-print/print.html
          grep -q '<meta name="govuk-print-contract" content="1"' out/manual-print/print.html
          grep -q 'data-page-label="page"' out/manual-print/print.html
          # #106: a real CSS Paged Media formatter resolves the page references
          sudo apt-get update -qq && sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0
          # 70.0 carries the fix for Kozea/WeasyPrint#2833 — 69.0 and earlier crash
          # resolving govuk-frontend's max(1px, .0625rem) underline thickness — and is
          # also a security release (CVE-2026-55073)
          pip install --quiet weasyprint==70.0 pypdf==6.1.1
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/markdown-mini/mdmini.ditamap \
            --format govuk --output out/markdown-pdf -Dgovuk.print=yes \
            "-Dgovuk.pdf.command=weasyprint --quiet" 2>&1 | tee pdf.log
          test -f out/markdown-pdf/mdmini.pdf
          absent -q 'GOVK008W' pdf.log
          python - <<'PY'
          from pypdf import PdfReader
          text = "\n".join(p.extract_text() or "" for p in PdfReader("out/markdown-pdf/mdmini.pdf").pages)
          assert "First case study" in text, "the publication did not render"
          assert "(page " in text, "cross-references carry no page number — did target-counter resolve?"
          print("page references resolved in the PDF")
          PY
          # #146: the home page and every footer link the PDF beside the print version,
          # with its size; no marker or token is left behind; the link resolves; and the
          # search index is still built, now after the PDF step
          size='Whole publication \(PDF, [0-9]+(\.[0-9])? (KB|MB)\)</a>'
          grep -Eq "<a class=\"govuk-link\" type=\"application/pdf\" href=\"mdmini\.pdf\">$size" out/markdown-pdf/index.html
          grep -Eq "<a class=\"govuk-footer__link\" type=\"application/pdf\" href=\"mdmini\.pdf\">$size" out/markdown-pdf/index.html
          grep -Eq "<a class=\"govuk-footer__link\" type=\"application/pdf\" href=\"mdmini\.pdf\">$size" out/markdown-pdf/intro.html
          grep -q 'href="print.html">Whole publication (print version)' out/markdown-pdf/index.html
          absent -rEq 'GOVUK_PDF_SIZE|govuk-pdf-->' out/markdown-pdf --include='*.html'
          absent -q 'application/pdf' out/markdown-pdf/print.html
          python3 tools/check_links.py out/markdown-pdf
          test -d out/markdown-pdf/pagefind
          # a failing command is a warning, not a failed build; and the command needs the print document
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/markdown-mini/mdmini.ditamap \
            --format govuk --output out/markdown-pdf-fail -Dgovuk.print=yes \
            "-Dgovuk.pdf.command=exit 3;" 2>&1 | tee pdf-fail.log
          grep -q '\[GOVK008W\]: the PDF command exited 3' pdf-fail.log
          test -f out/markdown-pdf-fail/index.html
          # ... and so is a command that succeeds without writing the PDF
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/markdown-mini/mdmini.ditamap \
            --format govuk --output out/markdown-pdf-empty -Dgovuk.print=yes \
            "-Dgovuk.pdf.command=true" 2>&1 | tee pdf-empty.log
          grep -q '\[GOVK008W\]: the PDF command exited 0 but wrote no file' pdf-empty.log
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/markdown-mini/mdmini.ditamap \
            --format govuk --output out/markdown-noprint "-Dgovuk.pdf.command=weasyprint" 2>&1 | tee pdf-noprint.log
          grep -q '\[GOVK008W\]: govuk.pdf.command is set but govuk.print is not' pdf-noprint.log
          # #146: without a PDF no page links one, and nothing of the link is left
          for site in out/markdown-pdf-fail out/markdown-pdf-empty out/markdown-noprint; do
            absent -rEq 'GOVUK_PDF_SIZE|govuk-pdf-->|application/pdf' "$site" --include='*.html'
          done
          # ... and a build that names no formatter is as it was
          absent -rEq 'GOVUK_PDF_SIZE|govuk-pdf-->|application/pdf' out/manual-print out/markdown-mini --include='*.html'
          # #113: DesignSystemPDF is not installed here, so govuk.pdf=auto (the
          # default) makes no PDF and says why; yes stops the build; a value it
          # does not know stops it too
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/markdown-mini/mdmini.ditamap \
            --format govuk --output out/markdown-pdf-auto -Dgovuk.print=yes -Dgovuk.search=no --verbose 2>&1 | tee pdf-auto.log
          grep -q 'govuk: PDF disabled (govuk.pdf=auto; DesignSystemPDF not found on PATH)' pdf-auto.log
          test ! -e out/markdown-pdf-auto/mdmini.pdf
          absent -rEq 'GOVUK_PDF_SIZE|govuk-pdf-->|application/pdf' out/markdown-pdf-auto --include='*.html'
          for bad in "-Dgovuk.pdf=yes|govuk.pdf=yes but DesignSystemPDF was not found" "-Dgovuk.pdf=maybe|govuk.pdf must be 'auto', 'yes' or 'no'"; do
            arg=${bad%%|*}; want=${bad#*|}
            if "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/markdown-mini/mdmini.ditamap \
                 --format govuk --output out/markdown-pdf-bad -Dgovuk.print=yes "$arg" > pdf-bad.log 2>&1; then
              echo "$arg should have failed the build"; exit 1
            fi
            grep -qF "$want" pdf-bad.log
          done

      # Content reaching readers (epic #77: #78 #79 #80 #81 #82 #59 #60 #61). Every
      # behaviour is a publisher parameter; every finding is a warning, never an error.
      - name: Content policy, SVG sanitising, dates, sitemap and CSP (#77)
        run: |
          set -o pipefail
          absent() { if grep "$@"; then echo "unexpected match: $*"; exit 1; fi; }
          media=out/kitchen/topics/media.html
          # #78 + #59: the unsafe diagram is inlined without its active content or DTD
          # default attributes; its ordinary external link stays; findings warned once
          grep -q 'Diagram with active content' "$media"
          absent -Eq "alert\('(script inside svg|svg loaded|rect|link)'\)" "$media"
          absent -Eq 'onload=|onclick=|foreignObject|tracker.png' "$media"
          absent -Eq 'contentScriptType|contentStyleType|zoomAndPan|baseProfile|xlink:type|xlink:show|xlink:actuate' "$media"
          grep -q 'href="https://example.org/"' "$media"
          grep -q "\[GOVK004W\].*unsafe.svg.*script, foreignObject, event-handler attributes, script-scheme links, remote references.*removed" kitchen.log
          # #81 default policy: warned, rendered as authored
          grep -q 'src="https://example.org/remote.png"' "$media"
          grep -q "href=\"javascript:alert('xref')\"" "$media"
          grep -q '<object' "$media"
          grep -q "\[GOVK006W\].*remote image 'https://example.org/remote.png' — kept" kitchen.log
          grep -q "\[GOVK006W\].*script-scheme link .* — kept" kitchen.log
          grep -q "\[GOVK006W\].*object embed .* — kept" kitchen.log
          # #61 default: no dates line; #79: no inline module script, init.js instead
          absent -q 'app-page-dates' out/kitchen/topics/reference-full.html
          absent -q 'type="module">import' "$media"
          grep -q 'type="module" src="../govuk/init.js"' "$media"
          gf=$(tr -d '[:space:]' < org.istanduk.gov-uk/resource/govuk-frontend/VERSION.txt)
          grep -q "govuk-frontend-${gf}.min.js" out/kitchen/govuk/init.js
          # govuk.svg.sanitize=no keeps the file as authored and still warns
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/dita13-kitchen/kitchen.ditamap \
            --format govuk --output out/kitchen-raw -Dgovuk.svg.sanitize=no 2>&1 | tee kitchen-raw.log
          grep -q "alert('script inside svg')" out/kitchen-raw/topics/media.html
          grep -q 'onload=' out/kitchen-raw/topics/media.html
          grep -q "\[GOVK004W\].*kept (govuk.svg.sanitize=no)" kitchen-raw.log
          # govuk.content.policy=strip replaces the findings with placeholders; govuk.dates=both
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/dita13-kitchen/kitchen.ditamap \
            --format govuk --output out/kitchen-strip -Dgovuk.content.policy=strip -Dgovuk.dates=both 2>&1 | tee kitchen-strip.log
          absent -Eq 'src="https://example.org/remote.png"|javascript:|<object' out/kitchen-strip/topics/media.html
          test "$(grep -o 'app-content-stripped' out/kitchen-strip/topics/media.html | wc -l)" -ge 3
          grep -q "\[GOVK006W\].*remote image .* — removed" kitchen-strip.log
          grep -q '<span class="app-page-dates__item">Published <time datetime="2026-01-14">14 January 2026</time></span>' out/kitchen-strip/topics/reference-full.html
          grep -q '<span class="app-page-dates__item">Last updated <time datetime="2026-09-07">7 September 2026</time></span>' out/kitchen-strip/topics/reference-full.html
          # govuk.content.warnings=no is silent; govuk.dates=updated shows the last revision only
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/dita13-kitchen/kitchen.ditamap \
            --format govuk --output out/kitchen-quiet -Dgovuk.content.warnings=no -Dgovuk.dates=updated 2>&1 | tee kitchen-quiet.log
          absent -q 'GOVK006W' kitchen-quiet.log
          grep -q 'Last updated <time datetime="2026-09-07">7 September 2026</time>' out/kitchen-quiet/topics/reference-full.html
          absent -q 'Published' out/kitchen-quiet/topics/reference-full.html
          # #80: a reference outside the input directory is not inlined by default (warned),
          # inlined with govuk.inline.scope=any (still warned)
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/inline-scope/scope.ditamap \
            --format govuk --output out/inline-scope 2>&1 | tee inline-scope.log
          grep -q "\[GOVK005W\].*linked.svg.*not inlined" inline-scope.log
          # the diagram's own <title> text proves inlining; the page chrome has SVG icons of its own
          absent -q 'Clickable diagram' "$(find out/inline-scope -name outside.html)"
          grep -q 'svgref' "$(find out/inline-scope -name outside.html)"
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/inline-scope/scope.ditamap \
            --format govuk --output out/inline-scope-any -Dgovuk.inline.scope=any 2>&1 | tee inline-scope-any.log
          grep -q "\[GOVK005W\].*linked.svg.*inlined (govuk.inline.scope=any)" inline-scope-any.log
          grep -q 'Clickable diagram' "$(find out/inline-scope-any -name outside.html)"
          # #60 + #82 + #61 on the manual: sitemap and robots, a CSP meta on every page
          # whose hash matches the one inline script, dates on (no manual topic has any)
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-csp -Dgovuk.site.url=https://example.org/manual \
            -Dgovuk.csp=meta -Dgovuk.dates=both -Dgovuk.print=yes
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('out/manual-csp/sitemap.xml')"
          absent -q '<!DOCTYPE' out/manual-csp/sitemap.xml
          grep -q '<loc>https://example.org/manual/index.html</loc>' out/manual-csp/sitemap.xml
          grep -q '<loc>https://example.org/manual/topics/install.html</loc>' out/manual-csp/sitemap.xml
          grep -q '<loc>https://example.org/manual/glossary.html</loc>' out/manual-csp/sitemap.xml
          absent -Eq '<loc>https://example.org/manual/(search|print).html</loc>' out/manual-csp/sitemap.xml
          grep -q 'Sitemap: https://example.org/manual/sitemap.xml' out/manual-csp/robots.txt
          grep -q '<meta name="robots" content="noindex"' out/manual-csp/print.html
          for f in out/manual-csp/index.html out/manual-csp/search.html out/manual-csp/glossary.html out/manual-csp/topics/install.html out/manual-csp/print.html; do
            grep -q "Content-Security-Policy\" content=\"default-src 'self'; script-src 'self' 'sha256-" "$f" || { echo "no CSP meta in $f"; exit 1; }
          done
          snippet=$(grep -o '<script>[^<]*</script>' out/manual-csp/topics/install.html | head -1 | sed 's/^<script>//; s/<\/script>$//')
          hash=$(printf '%s' "$snippet" | openssl dgst -sha256 -binary | base64)
          grep -q "'sha256-$hash'" out/manual-csp/topics/install.html || { echo "CSP hash does not match the inline snippet"; exit 1; }
          # #87: the manual documents every message the plugin can emit, and the security
          # and build-messages topics are built and linked
          for code in $(grep -o 'id="GOVK[0-9]*[IWEF]"' org.istanduk.gov-uk/messages.xml | cut -d'"' -f2); do
            grep -q "$code" docs/manual/topics/messages.dita || { echo "$code is not in the manual's build-messages topic"; exit 1; }
          done
          test -f out/manual/topics/security.html
          test -f out/manual/topics/messages.html
          grep -q "sha256-GUQ5ad8JK5KmEWmROf3LZd9ge94daqNvd8xy9YS1iDw=" out/manual/topics/security.html
          grep -q 'GOVK007W' out/manual/topics/messages.html
          grep -q 'topics/security.html' out/manual/topics/demo-figures.html
          # the default build: no sitemap, no robots, no CSP; bad values fail the build
          test ! -f out/manual/sitemap.xml
          test ! -f out/manual/robots.txt
          absent -q 'Content-Security-Policy' out/manual/index.html
          if "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/oruk-mini/oruk.ditamap --format govuk --output out/x-sitemap -Dgovuk.sitemap=yes; then echo "govuk.sitemap=yes without a URL should fail"; exit 1; fi
          if "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/oruk-mini/oruk.ditamap --format govuk --output out/x-csp -Dgovuk.csp=bogus; then echo "govuk.csp=bogus should fail"; exit 1; fi
          # Every branding mode is same-origin only, so 'self' policies hold in all of them:
          # logos are inline SVG or copied assets, fonts and the (suppressed) crest are
          # root-relative paths the publisher hosts; nothing is fetched from gov.uk or nhs.uk
          for site in out/manual out/manual-istanduk out/manual-nhs out/manual-official; do
            absent -Eroh 'src="(https?:)?//' "$site" --include='*.html'
            absent -Eroh '<link[^>]*href="(https?:)?//' "$site" --include='*.html'
            absent -Eroh 'url\(["'"'"']?(https?:)?//' "$site/govuk" --include='*.css'
            absent -Eroh '@import' "$site/govuk" --include='*.css'
          done

      # The brand-recoloured CSS is a vendored artifact (#47): guard against it
      # drifting from its Sass source. Rebuild it and fail on any diff.
      - name: Branding CSS is current
        run: |
          (cd tools/branding && npm ci && npm run build)
          if [ -n "$(git status --porcelain -- org.istanduk.gov-uk/resource/govuk-frontend)" ]; then
            echo "Vendored brand CSS is stale — run 'npm run build' in tools/branding and commit:"
            git --no-pager diff -- org.istanduk.gov-uk/resource/govuk-frontend | head -40
            exit 1
          fi
          echo "vendored brand CSS matches its Sass source"

      # The stock govuk-frontend files are vendored (#70): they must be byte-for-byte
      # the files in the GitHub release named in VERSION.txt, and that release zip
      # must match its recorded checksum. tools/branding/upgrade.sh makes an uplift:
      # VERSION.txt, the four files, the brand recompiles and GOVUK_FRONTEND_SHA256 above.
      - name: Vendored govuk-frontend matches its release
        run: |
          v=$(tr -d '[:space:]' < org.istanduk.gov-uk/resource/govuk-frontend/VERSION.txt)
          curl -sSL -o gf-release.zip "https://github.com/alphagov/govuk-frontend/releases/download/v${v}/release-v${v}.zip"
          echo "${GOVUK_FRONTEND_SHA256}  gf-release.zip" | sha256sum -c -
          unzip -q gf-release.zip -d gf-release
          for f in govuk-frontend-${v}.min.css govuk-frontend-${v}.min.js govuk-frontend-${v}.min.css.map govuk-frontend-${v}.min.js.map; do
            cmp "gf-release/$f" "org.istanduk.gov-uk/resource/govuk-frontend/$f" || { echo "vendored $f differs from release v${v}"; exit 1; }
          done
          echo "vendored govuk-frontend ${v} matches its release"

      # The Nu HTML checker from its npm package: an exact version whose tarball
      # npm verifies against the registry's published integrity hash (#68). The
      # tagged GitHub releases stop in 2020 and predate CSP3 keywords such as
      # 'wasm-unsafe-eval' (#82); the rolling "latest" release cannot be pinned.
      - name: Install Nu validator
        run: |
          npm install -g vnu-jar@26.9.7
          mkdir -p vnu && cp "$(npm root -g)/vnu-jar/build/dist/vnu.jar" vnu/vnu.jar
          java -jar vnu/vnu.jar --version

      - name: Validate HTML
        run: |
          set -e
          java -jar vnu/vnu.jar --errors-only --skip-non-html out/manual out/oruk-mini out/kitchen out/kitchen-flag out/manual-nhs out/manual-official out/manual-frt3 out/manual-custom out/keyref-nest out/keyref-nest-href out/manual-print out/oruk-print out/kitchen-print out/kitchen-raw out/kitchen-strip out/kitchen-quiet out/inline-scope out/inline-scope-any out/manual-csp out/markdown-mini out/markdown-pdf out/search-semantics out/search-semantics-json
          # NFR-A2: exactly one h1 and one main landmark per topic page
          for f in out/manual/topics/*.html; do
            test "$(grep -c '<h1' "$f")" = "1" || { echo "expected one h1 in $f"; exit 1; }
            test "$(grep -c '<main ' "$f")" = "1" || { echo "expected one main in $f"; exit 1; }
          done
          echo "HTML validation passed"

      - name: Check output
        run: |
          set -e
          # the vendored govuk-frontend release: written once, in VERSION.txt (#162)
          gf=$(tr -d '[:space:]' < org.istanduk.gov-uk/resource/govuk-frontend/VERSION.txt)
          page=out/manual/topics/introduction.html
          # GOV.UK template structure present
          grep -q 'class="govuk-template"' "$page"
          grep -q 'govuk-skip-link' "$page"
          grep -q 'app-sidebar__nav' "$page"
          grep -q 'id="main-content"' "$page"
          grep -q 'govuk-footer' "$page"
          # Typography classes applied
          grep -q 'govuk-heading-l' "$page"
          grep -q 'govuk-body' "$page"
          grep -q 'govuk-warning-text' out/manual/topics/demo-notes.html
          grep -q 'govuk-inset-text' out/manual/topics/demo-notes.html
          grep -q 'govuk-table__caption' out/manual/topics/demo-tables.html
          grep -q 'colspan="3"' out/manual/topics/demo-tables.html
          # Manual demonstrations render (C-16)
          grep -q 'aria-label="Publishing pipeline, referenced by key"' out/manual/topics/demo-figures.html
          test -f out/manual/images/architecture.svg
          grep -q 'govuk-list--number' out/manual/topics/install.html
          # ORUK idioms (design/07-gap-analysis-oruk.md): bookmap masthead uses
          # mainbooktitle only (F1); svgref renders as img without link class (F2);
          # keyref xrefs resolve; column spans and chunked headings survive
          grep -q '>ORUK Mini Test</a>' out/oruk-mini/item.html
          ! grep -q 'booktitlealt\|long abstract' out/oruk-mini/item.html
          grep -q '<svg [^>]*role="img"' out/oruk-mini/class-page.html
          test -f out/oruk-mini/images/sample.svg
          grep -q 'colspan="3"' out/oruk-mini/item.html
          grep -q 'href="child3.html"' out/oruk-mini/chapter.html
          grep -Eq '<h2[^>]*>child one</h2>' out/oruk-mini/item.html
          # Home pages are GOV.UK-styled (#8 / FR-N8 / C-10)
          grep -q 'class="govuk-template"' out/manual/index.html
          grep -q 'govuk-heading-xl' out/manual/index.html
          grep -q 'govuk-body-l' out/manual/index.html
          grep -q 'app-attribution' out/manual/index.html
          grep -q 'govuk-body-l' out/oruk-mini/index.html
          grep -q 'app-attribution' out/oruk-mini/index.html
          ! grep -q 'commonltr' out/manual/index.html
          test ! -f out/manual/commonltr.css
          # Navigation enhancement shipped (#9 / FR-N2, FR-N4)
          test -f out/manual/govuk/plugin.js
          grep -q 'govuk/plugin.js' out/manual/topics/introduction.html
          # Previous/next pagination in reading order (#32 / FR-N5)
          grep -q 'govuk-pagination--block' out/manual/topics/install.html
          grep -q 'link-title--decorated">About the plugin' out/manual/topics/install.html
          grep -q 'link-title--decorated">Building a website' out/manual/topics/install.html
          # svgref accessible name (#10 / NFR-A1)
          grep -q 'aria-label="Sample diagram"' out/oruk-mini/item.html
          # Search (#16 / FR-S): enabled on the manual, gracefully absent on oruk-mini
          test -f out/manual/pagefind/pagefind-ui.js
          grep -q 'search.html' out/manual/topics/introduction.html
          grep -q 'data-pagefind-body' out/manual/topics/introduction.html
          grep -q '<script src="govuk/search.js">' out/manual/search.html
          grep -q 'PagefindUI' out/manual/govuk/search.js
          ! grep -q 'search.html' out/oruk-mini/item.html
          test ! -d out/oruk-mini/pagefind
          # Landing-page layouts (#14 / D-13)
          grep -q 'app-entry__heading' out/manual/index.html
          grep -q 'app-group-list' out/manual/index.html
          grep -q 'govuk-button--start' out/oruk-mini/index.html
          grep -q 'govuk-grid-column-one-third' out/manual-grid/index.html
          grep -q 'govuk-accordion__section' out/manual-accordion/index.html
          # govuk.homepage.depth=1: entry headings only, no child lists
          grep -q 'app-entry__heading' out/manual-depth1/index.html
          ! grep -q 'app-group-list' out/manual-depth1/index.html
          # Phase banner (govuk.phase, FR-T3/#49): shown on every page when set,
          # with the tag capitalised and the feedback link; absent by default
          grep -q 'govuk-phase-banner' out/manual-depth1/index.html
          grep -q 'govuk-phase-banner' out/manual-depth1/topics/introduction.html
          grep -q 'govuk-phase-banner' out/manual-depth1/glossary.html
          grep -q 'phase-banner__content__tag">Beta<' out/manual-depth1/index.html
          grep -q 'href="https://example.org/feedback"' out/manual-depth1/topics/introduction.html
          ! grep -q 'govuk-phase-banner' out/manual/topics/introduction.html
          grep -q 'app-group-list' out/manual-grid/index.html
          # Manual documents the layouts with screenshots of itself
          grep -q 'homepage-grid.png' out/manual/topics/layouts.html
          test -f out/manual/images/homepage-grid.png
          # Header search on every page; glossary/index as footer support links
          grep -q 'app-masthead__search' out/manual/topics/introduction.html
          grep -q 'app-masthead__search' out/manual/index.html
          grep -q 'govuk-footer__inline-list' out/manual/topics/introduction.html
          ! grep -q 'app-masthead__search' out/oruk-mini/item.html
          # Bookmap metadata in the footer on every page type (#42)
          grep -q '© 2026 iStandUK' out/manual/topics/introduction.html
          grep -q '© 2026 iStandUK' out/manual/index.html
          grep -q '© 2026 iStandUK' out/manual/glossary.html
          # author == owner: no redundant attribution line
          ! grep -q 'app-footer__attribution' out/manual/topics/introduction.html
          # author distinct from owner surfaces as a footer attribution (oruk-mini)
          grep -q '© The Open Referral Initiative' out/oruk-mini/item.html
          grep -q '© The Open Referral Initiative' out/oruk-mini/index.html
          grep -q 'By Open Referral' out/oruk-mini/item.html
          # plain map (no bookmeta) keeps the service-name fallback, no copyright
          ! grep -q 'app-footer__attribution' out/kitchen/topics/blocks.html
          ! grep -q '©' out/kitchen/topics/blocks.html
          # Glossary and index (#17, #18 / FR-G, FR-X)
          grep -q 'app-az-letter' out/manual/glossary.html
          grep -q '(DITA)' out/manual/glossary.html
          # glossary is self-contained: full definitions inline, no links to
          # per-entry pages (which do not exist for resource-only glossentries) (#34)
          ! grep -q 'href="glossary/' out/manual/glossary.html
          # glossgroup members are harvested, not just standalone glossentry topics (#34)
          grep -q '>Saxon<' out/manual/glossary.html
          grep -q '>Pagefind<' out/manual/glossary.html
          grep -q 'app-index-sublist' out/manual/index-page.html
          grep -q 'see notes' out/manual/index-page.html
          grep -q 'glossary.html' out/manual/topics/introduction.html
          grep -q 'index-page.html' out/manual/topics/introduction.html
          grep -q 'abbreviated-form' out/manual/topics/glossary-index.html
          # Accessibility topic (documents the WCAG 2.2 AA posture + author statement)
          test -f out/manual/topics/accessibility.html
          grep -q 'Publishing your accessibility statement' out/manual/topics/accessibility.html
          grep -q 'accessibility.html' out/manual/index.html
          ! grep -q 'glossary.html' out/oruk-mini/item.html
          test ! -f out/oruk-mini/glossary.html
          test ! -f out/oruk-mini/index-page.html
          # Figure list / table list from bookmap booklists (#33 / FR-X)
          grep -q 'app-itemlist' out/manual/figurelist.html
          grep -q 'app-itemlist' out/manual/tablelist.html
          grep -q 'The start layout' out/manual/figurelist.html
          # figures/tables with an id deep-link to that element (topic-id__element-id)
          grep -q 'topics/layouts.html#layouts__fig-start' out/manual/figurelist.html
          grep -q 'Note type mapping' out/manual/tablelist.html
          # footer support links for both lists on content pages
          grep -q 'figurelist.html' out/manual/topics/introduction.html
          grep -q 'tablelist.html' out/manual/topics/introduction.html
          # only generated when the bookmap requests them (oruk-mini booklists has toc only)
          test ! -f out/oruk-mini/figurelist.html
          test ! -f out/oruk-mini/tablelist.html
          ! grep -q 'figurelist.html' out/oruk-mini/item.html
          # bookmap appendix builds and groups on the home page (auto layout, #33)
          test -f out/manual/topics/legal.html
          grep -q 'Licensing and legal' out/manual/index.html
          grep -q 'href="topics/legal.html"' out/manual/index.html
          # Spec-residue verification fixtures (#34)
          # bookmap frontmatter/backmatter content topics build
          test -f out/manual/topics/preface.html
          test -f out/manual/topics/colophon.html
          grep -q 'About this manual' out/manual/topics/preface.html
          # conref push: pushreplace + pushbefore land in the target page
          grep -q 'delivered by conref push' out/kitchen/topics/conref-push.html
          grep -q 'inserted before the marker' out/kitchen/topics/conref-push.html
          # coderef pulls external code into the codeblock
          grep -q '&lt;config&gt;' out/kitchen/topics/programming.html
          # object media embed renders as HTML <object> with fallback
          grep -q '<object ' out/kitchen/topics/media.html
          # ditavalref branch filter removes only its subtree's excluded content
          grep -q 'Common content' out/kitchen/topics/branch.html
          ! grep -q 'Draft-only' out/kitchen/topics/branch.html
          # RTL: @dir and @xml:lang propagate to the page
          grep -q 'lang="ar"' out/kitchen/topics/rtl.html
          grep -q 'dir="rtl"' out/kitchen/topics/rtl.html
          # DITAVAL start-flag image renders with its alt-text (flagged build)
          grep -q 'flag-new.svg" alt="New"' out/kitchen-flag/topics/blocks.html
          # Hazard panels and modern choicetable/properties tables (#27)
          # topichead-grouped maps link their children from the home page (auto layout)
          grep -q 'href="topics/blocks.html"' out/kitchen/index.html
          grep -q 'app-group-list' out/kitchen/index.html
          grep -q 'app-hazard__banner' out/kitchen/topics/hazard.html
          ! grep -q 'govuk-warning-text"' out/kitchen/topics/hazard.html
          grep -q 'choicetable govuk-table' out/kitchen/topics/task-full.html
          # Task labels, troubleshooting labels, ui-d, dl/lq styling (#30, #31)
          grep -q '<h2 class="sectiontitle tasklabel">Procedure' out/kitchen/topics/task-full.html
          grep -q 'app-trouble-label">Cause' out/kitchen/topics/troubleshooting.html
          grep -q 'app-trouble-label">Remedy' out/kitchen/topics/troubleshooting.html
          grep -q 'uicontrol app-uicontrol' out/kitchen/topics/inline-domains.html
          grep -q '<dl class="dl">' out/kitchen/topics/blocks.html
          grep -q '<blockquote class="lq">' out/kitchen/topics/blocks.html
          # MathML passthrough (#28) and native inline SVG with working links (#37)
          grep -q '<math xmlns="http://www.w3.org/1998/Math/MathML"' out/kitchen/topics/math.html
          grep -q '<svg ' out/kitchen/topics/media.html
          grep -Eq 'xlink:href="blocks.html"|href="blocks.html"' out/kitchen/topics/media.html
          grep -Eq 'xlink:href="reference-full.html"|href="reference-full.html"' out/kitchen/topics/media.html
          ! grep -q '<img class="xref svgref"' out/kitchen/topics/media.html
          ! grep -Eq 'cellpadding|cellspacing|choicetableborder' out/kitchen/topics/task-full.html out/kitchen/topics/reference-full.html
          # Plugin CSS never names the restricted typeface; the tile wrapper ships
          ! grep -q 'GDS Transport' out/manual/govuk/plugin.css
          ! grep -q 'GDS Transport' out/manual/govuk/overlay-istanduk.css
          grep -q 'app-tile' out/manual-grid/index.html
          # Localisable UI text (#19 / NFR-I1)
          grep -q 'data-label-menu="Menu"' out/manual/topics/introduction.html
          # iStandUK theme (govuk.branding=istanduk)
          grep -q 'overlay-istanduk.css' out/manual-istanduk/topics/introduction.html
          grep -q 'istanduk-logo.svg' out/manual-istanduk/topics/introduction.html
          test -f out/manual-istanduk/govuk/istanduk-logo.svg
          ! grep -q 'overlay-istanduk.css' out/manual/topics/introduction.html
          test -z "$(find out/manual-istanduk -name '*.woff*' -o -name '*crest*' -o -name '*crown*')"
          # NHS branding (govuk.branding=nhs, #47): recoloured base CSS, no neutral overlay,
          # on topic pages AND the generated cover (both build their own CSS links)
          grep -q "govuk-frontend-${gf}-nhs.min.css" out/manual-nhs/topics/introduction.html
          grep -q "govuk-frontend-${gf}-nhs.min.css" out/manual-nhs/index.html
          ! grep -q 'overlay-neutral.css' out/manual-nhs/topics/introduction.html
          ! grep -q 'overlay-neutral.css' out/manual-nhs/index.html
          grep -q '#005eb8' "out/manual-nhs/govuk/govuk-frontend-${gf}-nhs.min.css"
          grep -q 'Frutiger W01' "out/manual-nhs/govuk/govuk-frontend-${gf}-nhs.min.css"
          ! grep -q 'GDS Transport' "out/manual-nhs/govuk/govuk-frontend-${gf}-nhs.min.css"
          # NHS header identity (G3) and footer overlay (G4)
          test -f out/manual-nhs/govuk/overlay-nhs.css
          grep -q 'overlay-nhs.css' out/manual-nhs/topics/introduction.html
          grep -q 'app-masthead--nhs' out/manual-nhs/index.html
          grep -q 'app-masthead__nhs-logo' out/manual-nhs/index.html
          grep -q 'aria-label="NHS"' out/manual-nhs/index.html
          # other brands never load the NHS overlay
          ! grep -q 'overlay-nhs.css' out/manual/topics/introduction.html
          ! grep -q 'overlay-nhs.css' out/manual-istanduk/topics/introduction.html
          # NHS mode bundles no restricted font/crown assets either
          test -z "$(find out/manual-nhs -name '*.woff*' -o -name '*crest*' -o -name '*crown*')"
          # Official GOV.UK branding (govuk.branding=official, #47/#20): stock CSS
          # (the GOV.UK palette), the crown+wordmark header, OGL/crown-copyright footer
          grep -q "govuk-frontend-${gf}.min.css" out/manual-official/index.html
          ! grep -q 'overlay-neutral.css' out/manual-official/index.html
          grep -q 'overlay-official.css' out/manual-official/topics/introduction.html
          grep -q 'app-masthead__govuk-logo' out/manual-official/index.html
          grep -q 'aria-label="GOV.UK"' out/manual-official/index.html
          grep -q 'Open Government Licence' out/manual-official/topics/introduction.html
          grep -q 'Crown copyright' out/manual-official/topics/introduction.html
          # official ships no restricted font/crest asset (GDS Transport self-supplied;
          # the footer crest image is suppressed, not bundled)
          test -z "$(find out/manual-official -name '*.woff*' -o -name '*crest*' -o -name '*crown*')"
          ! grep -q 'overlay-official.css' out/manual/topics/introduction.html
          ! grep -q 'overlay-official.css' out/manual-nhs/topics/introduction.html
          # FR-T3 furniture params (#49): service URL, favicon, footer links/licence
          grep -q 'app-masthead__title" href="https://example.gov.uk"' out/manual-frt3/index.html
          grep -q 'app-masthead__title" href="https://example.gov.uk"' out/manual-frt3/topics/introduction.html
          grep -q '<link rel="icon" href="govuk/favicon.svg" type="image/svg+xml">' out/manual-frt3/index.html
          grep -q '<link rel="icon" href="../govuk/favicon.svg"' out/manual-frt3/topics/introduction.html
          test -f out/manual-frt3/govuk/favicon.svg
          grep -q 'href="https://example.gov.uk/privacy">Privacy</a>' out/manual-frt3/topics/introduction.html
          grep -q 'href="https://example.gov.uk/contact">Contact</a>' out/manual-frt3/glossary.html
          grep -q 'licence-description">© 2026 Example Service' out/manual-frt3/topics/introduction.html
          # defaults: none of these appear in a plain build
          ! grep -q '<link rel="icon"' out/manual/topics/introduction.html
          ! grep -q 'Example Service' out/manual/topics/introduction.html
          # FR-T1: neutral builds ship no restricted assets and load no external
          # resources (external hyperlinks in content are fine; external assets are not)
          test -z "$(find out/manual out/oruk-mini -name '*.woff*' -o -name '*crest*' -o -name '*crown*')"
          ! grep -Eroh 'src="https?://' out/manual out/oruk-mini --include='*.html'
          ! grep -Eroh '<link[^>]*href="https?://' out/manual out/oruk-mini --include='*.html'
          echo "All output checks passed"

      # Verification NFRs (#35)

      - name: Internal link check
        run: |
          python3 tools/check_links.py \
            out/manual out/oruk-mini out/kitchen out/kitchen-flag \
            out/manual-grid out/manual-accordion out/manual-depth1 out/manual-istanduk out/manual-nhs out/manual-official out/manual-frt3 \
            out/keyref-nest out/keyref-nest-href out/search-semantics out/search-semantics-json \
            out/manual-print out/oruk-print out/kitchen-print out/manual-print-ceiling \
            out/kitchen-raw out/kitchen-strip out/kitchen-quiet out/manual-csp out/markdown-mini

      - name: Page-weight budget (NFR-P2)
        run: python3 tools/page_weight.py --report --budget-kb 300 out/manual out/kitchen out/oruk-mini

      - name: Build determinism (FR-B6)
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/det-a -Dgovuk.search=no -Dgovuk.print=yes
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/det-b -Dgovuk.search=no -Dgovuk.print=yes
          diff -r out/det-a out/det-b && echo "double build is byte-identical"

      - name: Install accessibility tooling
        run: |
          (cd tools/a11y && npm ci)
          (cd tools/a11y && npx playwright install --with-deps chromium)

      - name: Accessibility checks — axe-core WCAG 2.2 AA (NFR-A1)
        run: node tools/a11y/run.mjs out/manual out/kitchen out/kitchen-flag out/manual-istanduk out/manual-nhs out/manual-official out/manual-frt3 out/manual-custom out/manual-print/print.html out/kitchen-print/print.html out/oruk-print/print.html out/markdown-mini/print.html out/kitchen-strip/topics/media.html out/kitchen-strip/topics/reference-full.html out/manual-csp/search.html

      # #82: the policy the plugin emits must not block anything on its own pages —
      # served over HTTP (a policy's 'self' is an origin), every page loaded, and a
      # search run so Pagefind's WebAssembly and fetches are exercised under it
      - name: Content-Security-Policy check (#82)
        run: node tools/a11y/csp-check.mjs out/manual-csp --query plugin

      # FR-P1/FR-P2 evidence (#63): the print document and a topic page print to
      # tagged, outlined, multi-page A4 PDFs in Chromium. CI-only; not a build
      # dependency.
      - name: Chromium print smoke (FR-P1, FR-P2)
        run: |
          node tools/a11y/print-smoke.mjs out/manual-print/print.html out/manual-print.pdf --paper A4
          node tools/a11y/print-smoke.mjs out/manual-print/topics/parameters.html out/parameters.pdf --paper A4

      - name: Visual snapshots for govuk-frontend upgrades (NFR-M2)
        run: |
          node tools/a11y/snapshot.mjs out/manual out/snapshots/neutral
          node tools/a11y/snapshot.mjs out/manual-istanduk out/snapshots/istanduk

      - name: Upload visual snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-snapshots-${{ env.DITA_OT_VERSION }}
          path: out/snapshots

      - name: Upload site artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: manual-site-${{ env.DITA_OT_VERSION }}
          path: out/manual

  # DesignSystemPDF (epic #105, D-23, D-25): the second product, built and
  # tested on its own. Its distribution carries an LGPL engine and open fonts
  # that never enter the plugin, so the checks here are about provenance as
  # much as behaviour: the fonts and the engine jars are the bytes their
  # projects published, and none of the engine is copied into the tree.
  designsystempdf:
    name: designsystempdf
    needs: changes
    if: needs.changes.outputs.pdf == 'true'
    runs-on: ubuntu-latest
    env:
      # the commit of notofonts/notofonts.github.io the bundled fonts were taken from (fonts/README.md)
      NOTO_FONTS_COMMIT: "1eb09fb315562c7e07d738691870e52c39b45b39"
      # the toolkit that builds the print documents to render; as in the build job's matrix
      DITA_OT_VERSION: "4.4.1"
      DITA_OT_SHA256: "154414c1debb548e923bf77e9a09019e249a8887680ff4bfbd8e137de9e8e250"
    defaults:
      run:
        working-directory: designsystempdf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: designsystempdf/pom.xml

      # The fonts are vendored: they must be the files recorded in SHA256SUMS,
      # and those must be the files the Noto project serves at the recorded commit.
      - name: Bundled fonts match their checksums and their upstream
        run: |
          (cd fonts && sha256sum -c SHA256SUMS)
          test "$(ls fonts/*.ttf | wc -l)" = "$(grep -c '\.ttf$' fonts/SHA256SUMS)" || { echo "a font is not listed in SHA256SUMS"; exit 1; }
          grep -q "$NOTO_FONTS_COMMIT" fonts/README.md || { echo "fonts/README.md does not name commit $NOTO_FONTS_COMMIT"; exit 1; }
          for f in fonts/*.ttf; do
            n=$(basename "$f"); family=${n%%-*}
            curl -sSfL -o "/tmp/$n" "https://raw.githubusercontent.com/notofonts/notofonts.github.io/${NOTO_FONTS_COMMIT}/fonts/${family}/hinted/ttf/${n}"
            cmp "$f" "/tmp/$n" || { echo "vendored $n differs from its upstream at $NOTO_FONTS_COMMIT"; exit 1; }
          done
          # no restricted typeface, ever
          if ls fonts | grep -Ei 'transport|frutiger'; then echo "a restricted typeface is in fonts/"; exit 1; fi
          echo "bundled fonts match their checksums and upstream"

      # The documents the generator exists for: the print documents the plugin in
      # this tree builds from its manual and fixtures (the supported toolkit,
      # checksum-verified as in the build job).
      - name: Cache DITA-OT
        id: cache-dita-ot
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dita-ot-${{ env.DITA_OT_VERSION }}
          key: dita-ot-${{ env.DITA_OT_VERSION }}

      - name: Download DITA-OT
        if: steps.cache-dita-ot.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          curl -sSL -o dita-ot.zip "https://github.com/dita-ot/dita-ot/releases/download/${DITA_OT_VERSION}/dita-ot-${DITA_OT_VERSION}.zip"
          echo "${DITA_OT_SHA256}  dita-ot.zip" | sha256sum -c -
          unzip -q dita-ot.zip
          rm dita-ot.zip

      - name: Build the print documents with the plugin in this tree
        working-directory: .
        run: |
          (cd org.istanduk.gov-uk && zip -qr ../org.istanduk.gov-uk.zip .)
          "dita-ot-${DITA_OT_VERSION}/bin/dita" uninstall org.istanduk.gov-uk || true
          "dita-ot-${DITA_OT_VERSION}/bin/dita" install "$PWD/org.istanduk.gov-uk.zip"
          for f in "docs/manual/manual.ditamap manual" "fixtures/dita13-kitchen/kitchen.ditamap kitchen" "fixtures/oruk-mini/oruk.ditamap oruk-mini"; do
            set -- $f
            "dita-ot-${DITA_OT_VERSION}/bin/dita" --input "$1" --format govuk --output "out/pdf/$2" -Dgovuk.print=yes -Dgovuk.search=no
            grep -q '<meta name="govuk-print-contract" content="1"' "out/pdf/$2/print.html"
          done

      # Unit tests, then the integration tests: the sample and each print document
      # rendered twice (byte-identical), with an outline, and valid PDF/UA-1 by
      # veraPDF — a pinned test dependency, never shipped.
      - name: Build, test, render and validate with veraPDF
        run: |
          docs="$GITHUB_WORKSPACE/out/pdf/manual/print.html:$GITHUB_WORKSPACE/out/pdf/kitchen/print.html:$GITHUB_WORKSPACE/out/pdf/oruk-mini/print.html"
          mvn -B -ntp --strict-checksums verify "-Ddesignsystempdf.it.documents=$docs"

      - name: The distribution is complete and the engine is unmodified
        run: |
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          zip="target/designsystempdf-${version}.zip"
          test -f "$zip"
          rm -rf /tmp/dist && mkdir /tmp/dist && unzip -q "$zip" -d /tmp/dist
          root="/tmp/dist/designsystempdf-${version}"
          for f in bin/designsystempdf bin/designsystempdf.bat "lib/designsystempdf-${version}.jar" \
                   LICENSE THIRD-PARTY-NOTICES licenses/LGPL-2.1.txt fonts/OFL.txt fonts/README.md fonts/SHA256SUMS \
                   README.md CHANGELOG.md; do
            test -f "$root/$f" || { echo "missing from the distribution: $f"; exit 1; }
          done
          test -x "$root/bin/designsystempdf"
          (cd "$root/fonts" && sha256sum -c SHA256SUMS)
          # LGPL: the engine ships as the jars its project published — each must match Maven Central's checksum
          count=0
          for jar in "$root"/lib/openhtmltopdf-*.jar; do
            n=$(basename "$jar" .jar); artifact=${n%-*}; v=${n##*-}
            want=$(curl -sSfL "https://repo1.maven.org/maven2/io/github/openhtmltopdf/${artifact}/${v}/${n}.jar.sha1" | cut -c1-40)
            have=$(sha1sum "$jar" | cut -c1-40)
            test "$want" = "$have" || { echo "$n.jar is not the published jar ($have, expected $want)"; exit 1; }
            # and its source goes out with every release
            test -f "target/engine-sources/${n}-sources.jar" || { echo "no source jar for $n"; exit 1; }
            count=$((count + 1))
          done
          test "$count" = 4 || { echo "expected the four engine jars, found $count"; exit 1; }
          # this product's own jar holds only its own code, and none of the engine's source is in the tree
          if unzip -Z1 "$root/lib/designsystempdf-${version}.jar" | grep -E '\.class$' | grep -v '^org/istanduk/designsystempdf/'; then
            echo "foreign classes in the product jar"; exit 1
          fi
          if grep -rIl --include='*.java' -E '^package (com\.openhtmltopdf|org\.apache)' src; then echo "third-party source in the tree"; exit 1; fi
          # every shipped jar is accounted for in the notices
          for jar in "$root"/lib/*.jar; do
            n=$(basename "$jar"); stem=$(printf '%s' "$n" | sed -E 's/-[0-9][0-9A-Za-z.]*\.jar$//')
            case "$stem" in batik-*) stem=batik ;; esac
            grep -q "lib/${stem}-" THIRD-PARTY-NOTICES || [ "$stem" = designsystempdf ] || { echo "$n is not named in THIRD-PARTY-NOTICES"; exit 1; }
          done
          # the launcher runs with only its own lib/ on the class path
          "$root/bin/designsystempdf" --version | tee /tmp/version.txt
          grep -q "^DesignSystemPDF ${version}$" /tmp/version.txt
          echo "distribution verified: $(du -h "$zip" | cut -f1)"

      # The unpacked distribution, through its launcher, as a publisher runs it:
      # the manual comes out page-numbered, and is the same file, byte for byte,
      # that the integration tests made and veraPDF passed.
      - name: The launcher renders the manual
        run: |
          absent() { if grep "$@"; then echo "unexpected match: $*"; exit 1; fi; }
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' pom.xml | head -1)
          dspdf="/tmp/dist/designsystempdf-${version}/bin/designsystempdf"
          "$dspdf" --in "$GITHUB_WORKSPACE/out/pdf/manual/print.html" --out /tmp/manual.pdf 2>&1 | tee /tmp/manual.log
          absent -q 'DSPDF' /tmp/manual.log
          grep -q 'tagged PDF/UA-1' /tmp/manual.log
          pages=$(sed -n 's/.* written, \([0-9]*\) pages.*/\1/p' /tmp/manual.log)
          test "${pages:-0}" -ge 40 || { echo "the manual should run to 40 pages or more, was: ${pages:-none}"; exit 1; }
          cmp /tmp/manual.pdf target/it/manual-print.html.pdf
          # a contract this release does not know is refused, and nothing is written
          sed 's/govuk-print-contract" content="1"/govuk-print-contract" content="2"/' "$GITHUB_WORKSPACE/out/pdf/manual/print.html" > /tmp/future.html
          rc=0; "$dspdf" --in /tmp/future.html --out /tmp/future.pdf 2> /tmp/future.log || rc=$?
          test "$rc" = 3 || { echo "expected exit code 3 for an unknown contract, was $rc"; exit 1; }
          grep -q '^\[DSPDF002E\]' /tmp/future.log
          test ! -e /tmp/future.pdf
          echo "the launcher rendered the manual: $pages pages"

      # The two products together, as the manual tells a publisher to use them:
      # the distribution's launcher on the PATH, named in govuk.pdf.command. The
      # build makes the PDF and every page links it with the file's real size (#146).
      - name: The plugin runs the launcher and links the PDF (#146)
        working-directory: .
        run: |
          set -o pipefail
          absent() { if grep "$@"; then echo "unexpected match: $*"; exit 1; fi; }
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' designsystempdf/pom.xml | head -1)
          export PATH="/tmp/dist/designsystempdf-${version}/bin:$PATH"
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap --format govuk \
            --output out/pdf/manual-site -Dgovuk.print=yes -Dgovuk.search=no \
            -Dgovuk.pdf.command=designsystempdf 2>&1 | tee /tmp/manual-site.log
          absent -Eq 'GOVK008W|DSPDF' /tmp/manual-site.log
          pdf=out/pdf/manual-site/manual.pdf
          test -f "$pdf"
          bytes=$(stat -c %s "$pdf")
          size=$(awk -v b="$bytes" 'BEGIN { if (b >= 1048064) printf "%.1f MB", b / 1048576; else printf "%d KB", int(b / 1024 + 0.5) }')
          grep -qF "href=\"manual.pdf\">Whole publication (PDF, ${size})</a>" out/pdf/manual-site/index.html
          grep -qF "href=\"../manual.pdf\">Whole publication (PDF, ${size})</a>" out/pdf/manual-site/topics/install.html
          grep -qF "href=\"manual.pdf\">Whole publication (PDF, ${size})</a>" out/pdf/manual-site/glossary.html
          absent -rEq 'GOVUK_PDF_SIZE|govuk-pdf-->' out/pdf/manual-site --include='*.html'
          echo "the build made $pdf and linked it as: PDF, ${size}"
          # #152: what the generator warns about reaches the build log when the PDF is
          # made — and a run with nothing to say (the manual, above) adds nothing. The
          # kitchen-sink fixture has Arabic text the bundled fonts cannot draw (the known
          # defect #153), so the generator warns; the PDF is still made and linked.
          absent -q 'the PDF command reported' /tmp/manual-site.log
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input fixtures/dita13-kitchen/kitchen.ditamap --format govuk \
            --output out/pdf/kitchen-site -Dgovuk.print=yes -Dgovuk.search=no \
            -Dgovuk.pdf.command=designsystempdf 2>&1 | tee /tmp/kitchen-site.log
          grep -q 'govuk: the PDF was written, and the PDF command reported:' /tmp/kitchen-site.log
          grep -q '\[DSPDF004W\]: .*ARABIC LETTER' /tmp/kitchen-site.log
          # ... and the right-to-left text is reported for what it is (#153)
          grep -q '\[DSPDF010W\]: the document has text in a right-to-left script' /tmp/kitchen-site.log
          absent -q 'GOVK008W' /tmp/kitchen-site.log
          test -f out/pdf/kitchen-site/kitchen.pdf
          grep -q 'href="kitchen.pdf">Whole publication (PDF, ' out/pdf/kitchen-site/index.html

      # #113: with the launcher on the PATH and nothing named, the default
      # govuk.pdf=auto finds it and makes the PDF, passing the paper and the
      # outline depth; no turns it off, and without govuk.print there is nothing
      # to render
      - name: The plugin finds DesignSystemPDF on its own (#113)
        working-directory: .
        run: |
          set -o pipefail
          absent() { if grep "$@"; then echo "unexpected match: $*"; exit 1; fi; }
          version=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' designsystempdf/pom.xml | head -1)
          export PATH="/tmp/dist/designsystempdf-${version}/bin:$PATH"
          dita() { "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap --format govuk -Dgovuk.search=no --verbose "$@"; }
          dita --output out/pdf/manual-auto -Dgovuk.print=yes -Dgovuk.pdf.paper=A5 -Dgovuk.print.toc.depth=8 2>&1 | tee /tmp/manual-auto.log
          grep -q 'govuk: PDF enabled (DesignSystemPDF found: designsystempdf)' /tmp/manual-auto.log
          grep -q 'with: designsystempdf --paper "A5" --orientation portrait --toc-depth 6$' /tmp/manual-auto.log
          absent -Eq 'GOVK008W|DSPDF' /tmp/manual-auto.log
          test -f out/pdf/manual-auto/manual.pdf
          grep -q 'href="manual.pdf">Whole publication (PDF, ' out/pdf/manual-auto/index.html
          dita --output out/pdf/manual-auto-no -Dgovuk.print=yes -Dgovuk.pdf=no 2>&1 | tee /tmp/manual-auto-no.log
          grep -q 'govuk: PDF disabled (govuk.pdf=no)' /tmp/manual-auto-no.log
          test ! -e out/pdf/manual-auto-no/manual.pdf
          absent -rEq 'GOVUK_PDF_SIZE|govuk-pdf-->|application/pdf' out/pdf/manual-auto-no --include='*.html'
          dita --output out/pdf/manual-auto-noprint 2>&1 | tee /tmp/manual-auto-noprint.log
          grep -q "govuk: PDF disabled (DesignSystemPDF found, but govuk.print is not 'yes')" /tmp/manual-auto-noprint.log
          test ! -e out/pdf/manual-auto-noprint/manual.pdf
          # yes needs the print document
          if dita --output out/pdf/manual-auto-bad -Dgovuk.pdf=yes > /tmp/manual-auto-bad.log 2>&1; then
            echo "govuk.pdf=yes without govuk.print=yes should have failed the build"; exit 1
          fi
          grep -q 'govuk.pdf=yes needs govuk.print=yes' /tmp/manual-auto-bad.log

      - name: Upload the distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: designsystempdf
          path: |
            designsystempdf/target/designsystempdf-*.zip
            designsystempdf/target/engine-sources/*.jar

      - name: Upload the rendered PDFs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: designsystempdf-pdfs
          path: designsystempdf/target/it/*.pdf

  # One stable status for branch protection to require: passes only when every
  # job the change called for passed — each matrix leg of `build` (add DITA-OT
  # versions to the matrix freely) and `designsystempdf`.
  ci:
    name: ci
    needs: [changes, build, designsystempdf]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          test "${{ needs.changes.result }}" = "success" || { echo "change classification failed: ${{ needs.changes.result }}"; exit 1; }
          check() { # job, wanted, result
            if [ "$2" = "true" ]; then
              test "$3" = "success" || { echo "$1 result: $3"; exit 1; }
              echo "$1 passed"
            else
              test "$3" = "skipped" || { echo "$1 was not wanted for this change but ended: $3"; exit 1; }
              echo "$1 skipped by design"
            fi
          }
          check build "${{ needs.changes.outputs.plugin }}" "${{ needs.build.result }}"
          check designsystempdf "${{ needs.changes.outputs.pdf }}" "${{ needs.designsystempdf.result }}"
