name: build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  DITA_OT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache DITA-OT
        id: cache-dita-ot
        uses: actions/cache@v4
        with:
          path: dita-ot-${{ env.DITA_OT_VERSION }}
          key: dita-ot-${{ env.DITA_OT_VERSION }}

      - name: Download DITA-OT
        if: steps.cache-dita-ot.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o dita-ot.zip "https://github.com/dita-ot/dita-ot/releases/download/${DITA_OT_VERSION}/dita-ot-${DITA_OT_VERSION}.zip"
          unzip -q dita-ot.zip
          rm dita-ot.zip

      - name: Install plugin
        run: |
          (cd org.istanduk.gov-uk && zip -qr ../org.istanduk.gov-uk.zip .)
          # The cached DITA-OT may hold the plugin from an earlier run
          "dita-ot-${DITA_OT_VERSION}/bin/dita" uninstall org.istanduk.gov-uk || true
          "dita-ot-${DITA_OT_VERSION}/bin/dita" install "$PWD/org.istanduk.gov-uk.zip"

      # Built BEFORE Pagefind is installed: exercises the graceful-absence path
      # (govuk.search=auto with no binary -> site without search, FR-S4)
      - name: Build ORUK fixture (no Pagefind)
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" \
            --input fixtures/oruk-mini/oruk.ditamap \
            --format govuk \
            --output out/oruk-mini

      - name: Install Pagefind
        run: npm install -g pagefind@1

      # Built with Pagefind on the PATH: search auto-enables (FR-S1)
      - name: Build manual
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" \
            --input docs/manual/manual.ditamap \
            --format govuk \
            --output out/manual

      - name: Build layout overrides
        run: |
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-grid -Dgovuk.homepage.layout=grid
          "dita-ot-${DITA_OT_VERSION}/bin/dita" --input docs/manual/manual.ditamap \
            --format govuk --output out/manual-accordion -Dgovuk.homepage.layout=accordion

      - name: Cache Nu validator
        id: cache-vnu
        uses: actions/cache@v4
        with:
          path: vnu
          key: vnu-20.6.30

      - name: Download Nu validator
        if: steps.cache-vnu.outputs.cache-hit != 'true'
        run: |
          curl -sSL -o vnu.zip "https://github.com/validator/validator/releases/download/20.6.30/vnu.jar_20.6.30.zip"
          unzip -q vnu.zip -d vnu-tmp
          mkdir -p vnu && mv vnu-tmp/dist/vnu.jar vnu/
          rm -rf vnu-tmp vnu.zip

      - name: Validate HTML
        run: |
          set -e
          java -jar vnu/vnu.jar --errors-only --skip-non-html out/manual out/oruk-mini
          # NFR-A2: exactly one h1 and one main landmark per topic page
          for f in out/manual/topics/*.html; do
            test "$(grep -c '<h1' "$f")" = "1" || { echo "expected one h1 in $f"; exit 1; }
            test "$(grep -c '<main ' "$f")" = "1" || { echo "expected one main in $f"; exit 1; }
          done
          echo "HTML validation passed"

      - name: Check output
        run: |
          set -e
          page=out/manual/topics/introduction.html
          # GOV.UK template structure present
          grep -q 'class="govuk-template"' "$page"
          grep -q 'govuk-skip-link' "$page"
          grep -q 'app-sidebar__nav' "$page"
          grep -q 'id="main-content"' "$page"
          grep -q 'govuk-footer' "$page"
          # Typography classes applied
          grep -q 'govuk-heading-l' "$page"
          grep -q 'govuk-body' "$page"
          grep -q 'govuk-warning-text' out/manual/topics/demo-notes.html
          grep -q 'govuk-inset-text' out/manual/topics/demo-notes.html
          grep -q 'govuk-table__caption' out/manual/topics/demo-tables.html
          grep -q 'colspan="3"' out/manual/topics/demo-tables.html
          # Manual demonstrations render (C-16)
          grep -q 'alt="Publishing pipeline, referenced by key"' out/manual/topics/demo-figures.html
          test -f out/manual/images/architecture.svg
          grep -q 'govuk-list--number' out/manual/topics/install.html
          # ORUK idioms (design/07-gap-analysis-oruk.md): bookmap masthead uses
          # mainbooktitle only (F1); svgref renders as img without link class (F2);
          # keyref xrefs resolve; column spans and chunked headings survive
          grep -q '>ORUK Mini Test</a>' out/oruk-mini/item.html
          ! grep -q 'booktitlealt\|long abstract' out/oruk-mini/item.html
          grep -q '<img class="xref svgref" src="images/sample.svg"' out/oruk-mini/class-page.html
          test -f out/oruk-mini/images/sample.svg
          grep -q 'colspan="3"' out/oruk-mini/item.html
          grep -q 'href="child3.html"' out/oruk-mini/chapter.html
          grep -Eq '<h2[^>]*>child one</h2>' out/oruk-mini/item.html
          # Home pages are GOV.UK-styled (#8 / FR-N8 / C-10)
          grep -q 'class="govuk-template"' out/manual/index.html
          grep -q 'govuk-heading-xl' out/manual/index.html
          grep -q 'app-contents' out/manual/index.html
          grep -q 'govuk-body-l' out/manual/index.html
          grep -q 'app-attribution' out/manual/index.html
          grep -q 'govuk-body-l' out/oruk-mini/index.html
          grep -q 'app-attribution' out/oruk-mini/index.html
          ! grep -q 'commonltr' out/manual/index.html
          test ! -f out/manual/commonltr.css
          # Navigation enhancement shipped (#9 / FR-N2, FR-N4)
          test -f out/manual/govuk/plugin.js
          grep -q 'govuk/plugin.js' out/manual/topics/introduction.html
          # svgref accessible name (#10 / NFR-A1)
          grep -q 'alt="Sample diagram"' out/oruk-mini/item.html
          # Search (#16 / FR-S): enabled on the manual, gracefully absent on oruk-mini
          test -f out/manual/pagefind/pagefind-ui.js
          grep -q 'search.html' out/manual/topics/introduction.html
          grep -q 'data-pagefind-body' out/manual/topics/introduction.html
          grep -q 'PagefindUI' out/manual/search.html
          ! grep -q 'search.html' out/oruk-mini/item.html
          test ! -d out/oruk-mini/pagefind
          # Landing-page layouts (#14 / D-13)
          grep -q 'app-entry__heading' out/manual/index.html
          grep -q 'app-group-list' out/manual/index.html
          grep -q 'govuk-button--start' out/oruk-mini/index.html
          grep -q 'govuk-grid-column-one-third' out/manual-grid/index.html
          grep -q 'govuk-accordion__section' out/manual-accordion/index.html
          # Localisable UI text (#19 / NFR-I1)
          grep -q 'data-label-menu="Menu"' out/manual/topics/introduction.html
          # FR-T1: neutral builds ship no restricted assets and load no external
          # resources (external hyperlinks in content are fine; external assets are not)
          test -z "$(find out/manual out/oruk-mini -name '*.woff*' -o -name '*crest*' -o -name '*crown*')"
          ! grep -Eroh 'src="https?://' out/manual out/oruk-mini --include='*.html'
          ! grep -Eroh '<link[^>]*href="https?://' out/manual out/oruk-mini --include='*.html'
          echo "All output checks passed"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: manual-site
          path: out/manual
