<svg xmlns="http://www.w3.org/2000/svg" width="360" height="60" viewBox="0 0 360 60">
  <title>A return contains records, and each record contains data elements.</title>
  <rect x="5" y="10" width="100" height="40" fill="#1d70b8"/>
  <rect x="130" y="10" width="100" height="40" fill="#1d70b8"/>
  <rect x="255" y="10" width="100" height="40" fill="#1d70b8"/>
  <text x="55" y="35" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-size="13">Return</text>
  <text x="180" y="35" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-size="13">Record</text>
  <text x="305" y="35" fill="#ffffff" text-anchor="middle" font-family="sans-serif" font-size="13">Element</text>
</svg>
